<!doctype html>
<html lang="en">
  <head>
    <title>Cartier WAW 2025</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />

    <!-- Parallel module and font preloads -->
    <link rel="modulepreload" crossorigin href="/sixftyfps-waw-app.js" />
    <link rel="preload" as="style" href="/sixftyfps-waw-index.css" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/BrilliantCutPro-Regular.woff2" />

    <!-- Device-adaptive model preloader: starts streaming GLBs instantly in parallel with JS parsing -->
    <script>
      (function () {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 768);
        var scenes = isMobile ? "/assets/manifest/models/scenesMobile.glb" : "/assets/manifest/models/scenes.glb";
        var products = isMobile ? "/assets/manifest/models/productsMobile.glb" : "/assets/manifest/models/products.glb";

        var criticalAssets = [
          scenes,
          products,
          "/assets/textures/envmaps/brown_photostudio_02_1k.exr",
          "/assets/langs/fr_fr.json"
        ];

        criticalAssets.forEach(function (url) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "fetch";
          link.crossOrigin = "anonymous";
          link.href = url;
          document.head.appendChild(link);
        });
      })();
    </script>

    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        background-color: #000;
      }

      /* Premium seamless loading screen */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .loader-brand {
        font-size: 14px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 300;
      }
      .loader-spinner {
        width: 38px;
        height: 38px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #e5e5e5;
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script type="module" crossorigin src="/sixftyfps-waw-app.js"></script>
    <link rel="stylesheet" crossorigin href="/sixftyfps-waw-index.css" />
  </head>

  <body>
    <!-- Initial Loading Screen -->
    <div id="app-loader">
      <div class="loader-content">
        <div class="loader-brand">Cartier</div>
        <div class="loader-spinner"></div>
      </div>
    </div>

    <script>
      (function () {
        function dismissLoader() {
          var loader = document.getElementById("app-loader");
          if (loader && !loader.classList.contains("hidden")) {
            loader.classList.add("hidden");
            setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 650);
          }
        }

        document.addEventListener("DOMContentLoaded", function () {
          var app = document.querySelector("sixtyfps-app");
          if (app) {
            var observer = new MutationObserver(function () {
              if (app.querySelector("canvas")) {
                observer.disconnect();
                // Dismiss once WebGL canvas is mounted and painting
                requestAnimationFrame(function () {
                  setTimeout(dismissLoader, 150);
                });
              }
            });
            observer.observe(app, { childList: true, subtree: true });
          }
        });

        // Safety fallback so loader never remains permanently
        window.addEventListener("load", function () {
          setTimeout(dismissLoader, 3000);
        });
      })();
    </script>

    <header class="sixtyfps-fake-site-header"></header>
    <div class="sixtyfps-fake-site-container">
      <!-- IMPORT CODE FROM HERE  -->
      <div id="sixtyfps-wrapper" style="--longpress-progress: 0">
        <sixtyfps-app></sixtyfps-app>
      </div>

      <script>
        const SIXTYFPS_LANG = "fr-fr";
        const SIXTYFPS_ASSETS_PATH = "/assets/";
      </script>
      <!-- TO HERE  -->
    </div>
    <footer class="sixtyfps-fake-site-footer"></footer>
  </body>
</html>
